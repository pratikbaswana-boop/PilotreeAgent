[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triage-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.10.1",
    "structlog==24.4.0",
    "langgraph==0.5.3",
    "langgraph-checkpoint-postgres==2.0.25",
    "psycopg[binary,pool]>=3.2,<4",
    "google-genai>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "asgi-lifespan==2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Ruff ──────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "T20"]
ignore = ["S101"]  # assert in tests is fine

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20", "E402"]
"alembic/*" = ["E402"]  # import order in alembic env is relaxed
"app/api/routers/*" = ["B008"]  # FastAPI Depends() in defaults is idiomatic
"app/security/auth.py" = ["B008"]  # FastAPI Depends() in defaults is idiomatic

# ── Mypy ──────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "jwt.*"
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
